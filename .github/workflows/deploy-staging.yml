# staging: re-verify, apply D1 migrations BEFORE deploy (PRD §14), deploy, smoke.
#
# Manual trigger (changed 1 Sep 2026, Shivendra's call). This was `push:
# branches: [main]`; deploys now happen only when someone runs the workflow —
# Actions → Deploy staging → Run workflow, picking the ref to deploy.
name: Deploy staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply D1 migrations (staging)
        run: pnpm --filter @r301/api exec wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy Worker (staging)
        # GIT_SHA surfaces in GET /v1/health and tags the Sentry release (D25).
        run: pnpm --filter @r301/api exec wrangler deploy --env staging --var GIT_SHA:${{ github.sha }}
      - name: Smoke test (staging) # script lands with the M0 CI prompt — see docs/testing.md §5
        run: pnpm --filter @r301/api smoke
        env:
          SMOKE_API_BASE: https://api-staging.r301.dev
          SMOKE_REDIRECT_BASE: https://staging.r301.dev
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY_STAGING }}
