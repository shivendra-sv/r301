# production: the promote step (PRD §14). Same shape as staging, prod targets.
#
# Manual trigger (changed 1 Sep 2026, Shivendra's call). This was `push: tags:
# ["v*"]`; pushing a tag no longer deploys. Run it from Actions → Deploy
# production → Run workflow and **select the `v*` tag** as the ref, so the
# deployed SHA is the tagged one.
#
# ⚠️ Tags created *before* this change (v0.1.0, v0.1.1, v0.2.0) still carry the
# old push-only trigger in their own tree, so they cannot be dispatched. Only
# tags cut after this commit are dispatchable.
name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply D1 migrations (production)
        run: pnpm --filter @r301/api exec wrangler d1 migrations apply DB --env production --remote
      - name: Deploy Worker (production)
        # GIT_SHA surfaces in GET /v1/health and tags the Sentry release (D25).
        run: pnpm --filter @r301/api exec wrangler deploy --env production --var GIT_SHA:${{ github.sha }}
      - name: Smoke test (production) # post-deploy smoke per PRD §14
        run: pnpm --filter @r301/api smoke
        env:
          SMOKE_API_BASE: https://api.r301.dev
          SMOKE_REDIRECT_BASE: https://r301.dev
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY_PRODUCTION }}
